<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五十音学习</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4A90A4;
      --primary-dark: #3D7A8A;
      --primary-soft: #E8F2F5;
      --primary-glow: rgba(74, 144, 164, 0.18);

      --bg: #F5F7F8;
      --surface-2: #F8FAFB;
      --surface-3: #EEF2F4;

      --border: #E8EDEF;
      --border-strong: #D8E1E5;

      --text-1: #2C3E44;
      --text-2: #7A8B92;
      --text-3: #A8B5BB;

      --success: #5FAF92;
      --success-soft: #E5F3EC;
      --success-text: #3A7D5C;
      --danger: #E08888;
      --danger-dark: #C97272;
      --danger-soft: #FAE8E8;
      --danger-text: #B85C5C;
      --star: #E8B84B;

      --shadow-card: 0 4px 12px rgba(44, 62, 68, 0.06);
      --shadow-card-lg: 0 8px 24px rgba(44, 62, 68, 0.08);
      --shadow-glow: 0 4px 12px var(--primary-glow);
      --shadow-modal: 0 10px 40px rgba(44, 62, 68, 0.15);

      --overlay: rgba(44, 62, 68, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
      padding: 20px;
      padding-top: 40px;
    }

    .app {
      width: min(100%, 680px);
      text-align: center;
    }

    button {
      font-size: 15px;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background: var(--surface-3);
      color: var(--text-1);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }

    button:active { transform: scale(0.98); }
    button.active { background: var(--primary); color: white; }
    button.secondary { background: var(--surface-3); color: var(--text-1); }
    button.danger { background: var(--danger); color: white; }
    button.danger:hover { background: var(--danger-dark); }
    .hidden { display: none !important; }

    .nav-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    /* 学习模式：已掌握切换 chip */
    .learn-chips {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .group-chip {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--text-1);
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .group-chip:active { transform: scale(0.96); }
    .group-chip.active { background: var(--primary); color: white; }
    .group-chip:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ================= 随机翻卡模式 ================= */
    .random-card-container { display: flex; justify-content: center; margin-bottom: 16px; }
    .random-card { width: 260px; height: 170px; cursor: pointer; position: relative; }
    .random-card-front, .random-card-back {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white;
      border-radius: 24px; box-shadow: var(--shadow-card-lg); display: flex; flex-direction: column;
      justify-content: center; align-items: center; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .random-card-front { z-index: 2; opacity: 1; transform: scale(1); }
    .random-card-back { z-index: 1; opacity: 0; transform: scale(0.95); }
    .random-card.flipped .random-card-front { z-index: 1; opacity: 0; transform: scale(0.95); }
    .random-card.flipped .random-card-back { z-index: 2; opacity: 1; transform: scale(1); }
    .random-card-front .card-text { font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 80px; font-weight: 600; color: var(--text-1); line-height: 1; }
    .random-card-kana-row { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
    .random-card-kana-row .card-kana { font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 48px; font-weight: 600; color: var(--text-1); line-height: 1.1; }
    .random-card-back .card-romaji { font-size: 24px; font-weight: 600; color: var(--primary); margin-top: 6px; }

    .random-trace-container {
      position: relative; width: 260px; height: 297.5px; margin: 0 auto 16px auto; border: 2px dashed var(--border-strong);
      border-radius: 16px; overflow: hidden; background: #fff; touch-action: none;
      display: flex; justify-content: center; align-items: center;
    }
    .clear-icon {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0; border-radius: 50%;
      background: rgba(255,255,255,0.9); border: 1px solid var(--border); color: var(--text-3); font-size: 18px; line-height: 1;
      display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; transition: all 0.2s;
    }
    .clear-icon:hover { background: var(--danger); color: white; border-color: var(--danger); }
    .random-trace-container .trace-bg, .trace-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-evenly;
      align-items: center; font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 110px; color: var(--border);
      font-weight: 600; pointer-events: none; user-select: none; line-height: 1;
    }
    #randomTraceCanvas, #writingCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }

    /* ================= 学习模式（四宫格） ================= */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .card {
      position: relative; background: white; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-card);
      cursor: pointer; user-select: none; min-height: 160px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:active { transform: scale(0.97); }
    .card.revealed { box-shadow: var(--shadow-glow); border: 2px solid var(--primary); }
    .card-main { font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 56px; line-height: 1.1; font-weight: 600; color: var(--text-1); }
    .card-revealed-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .card-revealed-kana-row { display: flex; gap: 16px; justify-content: center; align-items: baseline; }
    .card-revealed-kana { font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 48px; font-weight: 600; color: var(--text-1); line-height: 1.1; }
    .card-revealed-romaji { font-size: 24px; color: var(--primary); font-weight: 600; margin-top: 8px; }
    .star-icon {
      position: absolute; bottom: 10px; right: 12px; font-size: 24px; color: var(--border-strong); cursor: pointer; line-height: 1;
      transition: color 0.2s, transform 0.15s; z-index: 10; user-select: none;
    }
    .star-icon:hover { transform: scale(1.15); }
    .star-icon.active { color: var(--star); }

    /* 已掌握集合视图：宽高缩减至约二分之一 */
    .grid-container.mastered-view {
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .grid-container.mastered-view .card {
      min-height: 80px;
      padding: 10px 6px;
      border-radius: 12px;
    }
    .grid-container.mastered-view .card.revealed {
      border-width: 1px;
      box-shadow: 0 2px 6px var(--primary-glow);
    }
    .grid-container.mastered-view .card-main { font-size: 28px; }
    .grid-container.mastered-view .card-revealed-kana-row { gap: 8px; }
    .grid-container.mastered-view .card-revealed-kana { font-size: 24px; }
    .grid-container.mastered-view .card-revealed-romaji { font-size: 12px; margin-top: 4px; }
    .grid-container.mastered-view .star-icon { font-size: 12px; bottom: 4px; right: 6px; }

    .progress { display: flex; justify-content: space-between; color: var(--text-2); font-size: 14px; margin: 16px 4px; }
    .action-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    /* ================= 五十音图表模式 ================= */
    .chart-wrapper { background: white; border-radius: 20px; padding: 20px 10px; box-shadow: var(--shadow-card); overflow-x: auto; }
    .chart-header { display: flex; justify-content: flex-end; margin-bottom: 10px; padding: 0 10px; }
    #playChartBtn { font-size: 14px; padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    #playChartBtn.playing { background: var(--danger); }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th, td { border: 1px solid var(--border); padding: 10px 4px; text-align: center; vertical-align: middle; }
    th { background: var(--surface-2); color: var(--text-3); font-size: 13px; font-weight: 500; }
    td { cursor: pointer; transition: background 0.1s; user-select: none; position: relative; }
    td:hover { background: var(--primary-soft); }
    td.playing-cell { background: var(--primary-soft) !important; box-shadow: inset 0 0 0 2px var(--primary); }
    .chart-kana-row { display: flex; justify-content: center; gap: 4px; align-items: baseline; }
    .chart-kana { font-family: 'Klee One', 'Yomogi', sans-serif; font-size: 18px; font-weight: 600; color: var(--text-1); }
    .chart-romaji { font-size: 12px; color: var(--primary); margin-top: 2px; }
    .chart-row-title { font-size: 14px; color: var(--text-2); background: var(--surface-2); font-weight: 500; }
    .section-title { text-align: left; font-size: 14px; color: var(--text-3); margin: 20px 0 8px 4px; font-weight: 600; }

    /* ================= 模式四：玩一下 ================= */
    .play-menu { 
      display: flex; flex-direction: column; gap: 20px; padding: 40px 20px; 
      align-items: center;
    }
    .play-menu-btn {
      width: 75%;
      font-size: 20px; 
      padding: 22px;
      border-radius: 20px; background: white; box-shadow: var(--shadow-card);
      display: flex; align-items: center; justify-content: center; gap: 15px; cursor: pointer; transition: transform 0.15s;
    }
    .play-menu-btn:active { transform: scale(0.97); }
    .play-menu-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .play-menu-icon svg { width: 100%; height: 100%; }

    /* 连连看 + 翻牌子 通用网格（列数/字号由 JS 设置 CSS 变量） */
    .match-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols, 4), 1fr);
      gap: 10px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      max-width: 400px;
      margin: 0 auto 20px auto;
    }
    .match-card {
      aspect-ratio: 1;
      background: var(--surface-2);
      border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Klee One', 'Yomogi', sans-serif;
      font-size: var(--grid-font, 32px);
      font-weight: 600; cursor: pointer; transition: all 0.2s; user-select: none;
      color: var(--text-1);
    }
    .match-card.selected { background: var(--primary); color: white; transform: scale(1.05); }
    .match-card.matched { background: var(--success); color: white; opacity: 0.5; pointer-events: none; }

    /* 翻牌子卡片样式（用户要求保留，颜色不改） */
    .flip-card {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Klee One', 'Yomogi', sans-serif;
      font-size: var(--grid-font, 32px);
      font-weight: 600; cursor: pointer;
      transition: all 0.3s; user-select: none;
      background: #e5e5ea;
      color: #1c1c1e;
    }
    .flip-card.flipped { background: #f5f5f7; color: #000; }
    .flip-card.matched { background: #e5e5ea; color: #1c1c1e; pointer-events: none; }

    /* 接住它 */
    .catch-game-container {
      position: relative; width: 100%; max-width: 400px; height: 525px; margin: 0 auto 10px auto;
      background: #E8F2F5; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-card-lg); touch-action: none;
    }
    #catchCanvas { display: block; width: 100%; height: 100%; }
    .catch-hud {
      display: flex; justify-content: space-between; align-items: center; max-width: 400px;
      margin: 0 auto 10px auto; padding: 0 10px; font-size: 18px; font-weight: 600;
      color: var(--text-1);
    }
    .catch-intro-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center; z-index: 10;
    }
    .catch-intro-content { text-align: center; }
    .catch-intro-content h3 { margin: 0 0 20px 0; color: var(--text-1); font-size: 20px; }
    .catch-cards { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
    .catch-card {
      background: white; border: 2px solid var(--border); border-radius: 16px; padding: 15px 20px;
      display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow-card); min-width: 80px;
      cursor: pointer; transition: transform 0.1s, border-color 0.2s;
    }
    .catch-card:active { transform: scale(0.95); }
    .catch-card:hover { border-color: var(--primary); }
    .card-label { font-size: 12px; color: var(--text-3); margin-bottom: 5px; }
    .card-kana { font-family: 'Klee One', sans-serif; font-size: 32px; font-weight: 600; color: var(--text-1); }
    .card-romaji { font-family: 'Klee One', sans-serif; font-size: 24px; font-weight: 600; color: var(--primary); }
    #catchStartBtn { font-size: 16px; padding: 10px 30px; }

    /* ================= 填空 ================= */
    /* HUD 对齐白框左右边缘 */
    .fill-hud {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 444px;
      margin: 0 auto 15px auto;
      padding: 0;
      font-size: 18px; font-weight: 600;
      color: var(--text-1);
    }
    .fill-game-container {
      max-width: 444px;
      padding: 20px 18px;
      margin: 0 auto 9px auto;
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow-card);
    }
    .fill-card {
      padding: 30px 18px;
      margin-bottom: 17px;
      min-height: 131px;
      background: var(--surface-2);
      border-radius: 18px;
      display: flex; justify-content: center; align-items: center;
    }
    .fill-prompt {
      font-family: 'Klee One', 'Yomogi', sans-serif;
      font-size: 71px;
      font-weight: 600; color: var(--text-1); line-height: 1;
    }
    .fill-input-row { display: flex; gap: 11px; margin-bottom: 13px; align-items: stretch; }
    .fill-input {
      flex: 1; min-width: 0;
      font-size: 18px;
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: white;
      color: var(--text-1);
      text-align: center;
      font-family: 'Klee One', 'Yomogi', sans-serif;
      min-height: 48px; outline: none;
      display: flex; align-items: center; justify-content: center;
      line-height: 1.5; overflow-wrap: break-word; word-break: break-all;
    }
    .fill-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 144, 164, 0.12); }
    .fill-input:empty:before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
    .fill-input .ok { color: var(--success-text); background: var(--success-soft); border-radius: 4px; padding: 0 1px; }
    .fill-input .err { color: var(--danger-text); background: var(--danger-soft); border-radius: 4px; padding: 0 1px; }
    .fill-input-row button {
      font-size: 14px;
      padding: 12px 25px;
      background: var(--primary); color: white;
      white-space: nowrap; min-width: 80px; border-radius: 11px;
    }
    .fill-result {
      min-height: 21px;
      font-size: 13px;
      font-weight: 600; text-align: center;
    }

    /* 通用弹窗 */
    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--overlay);
      display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; border-radius: 24px; width: 100%; max-width: 440px; padding: 20px;
      box-shadow: var(--shadow-modal); display: flex; flex-direction: column;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-play-btn { font-size: 15px; padding: 8px 20px; border-radius: 10px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: 600; }
    .close-btn { background: none; border: none; font-size: 28px; color: var(--text-3); cursor: pointer; padding: 0 8px; line-height: 1; }
    .close-btn:hover { color: var(--text-1); }
    .canvas-container {
      position: relative; width: 100%; aspect-ratio: 1 / 1; border: 2px dashed var(--border-strong); border-radius: 16px;
      overflow: hidden; background: #fff; margin-bottom: 16px; touch-action: none;
    }
    .modal-footer { display: flex; gap: 10px; justify-content: center; }
    .modal-footer button { flex: 1; }

    /* 模式选择弹窗 */
    .mode-select-title { font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: var(--text-1); }
    .mode-select-sub { font-size: 13px; color: var(--text-3); margin-bottom: 20px; line-height: 1.6; }
    .mode-select-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .mode-select-btn {
      font-size: 16px; padding: 18px; border-radius: 14px; border: none;
      background: var(--surface-2); color: var(--text-1); cursor: pointer;
      font-weight: 600; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .mode-select-btn:hover:not(:disabled) { background: var(--surface-3); }
    .mode-select-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #modeSelectModal .modal-footer { justify-content: center; }
    #modeSelectModal .modal-footer button {
      background: none; color: var(--primary); padding: 6px 12px;
      font-size: 15px; border-radius: 0; font-weight: 500; min-width: auto;
    }
    #modeSelectModal .modal-footer button:hover { background: none; color: var(--primary-dark); }
    #modeSelectModal .modal-footer button:active { transform: none; }

    /* 重置确认弹窗 */
    #resetConfirmModal .modal-content { max-width: 360px; text-align: center; }
    #resetConfirmModal .mode-select-sub { margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="app">
    
    <div class="nav-buttons">
      <button id="modeRandomBtn" class="active">随机翻卡</button>
      <button id="modeLearnBtn">学习模式</button>
      <button id="modeChartBtn">五十音图表</button>
      <button id="modePlayBtn">玩一下</button>
    </div>

    <!-- 随机翻卡区域 -->
    <div id="randomView">
      <div class="random-card-container">
        <div id="randomCard" class="random-card">
          <div class="random-card-front"><div class="card-text" id="randomCardFront">あ</div></div>
          <div class="random-card-back">
            <div class="random-card-kana-row">
              <span class="card-kana" id="randomCardBackMain">あ</span>
              <span class="card-kana" id="randomCardBackSub">ア</span>
            </div>
            <div class="card-romaji" id="randomCardBackRomaji">a</div>
          </div>
        </div>
      </div>
      <div id="randomTraceContainer" class="random-trace-container hidden">
        <button id="clearRandomTraceBtn" class="clear-icon" title="清空">×</button>
        <div class="trace-bg" id="randomTraceBg">あ ア</div>
        <canvas id="randomTraceCanvas"></canvas>
      </div>
      <button id="nextRandomBtn" class="secondary">换一张</button>
    </div>

    <!-- 学习模式区域 -->
    <div id="learnView" class="hidden">
      <div class="learn-chips">
        <button id="learnMasteredChip" class="group-chip">已掌握(0)</button>
      </div>
      <div id="grid" class="grid-container"></div>
      <div class="progress" id="learnProgress">
        <span id="progressText">本轮已翻开 0 / 4</span>
        <span id="masteredText">已掌握 0 / 71</span>
      </div>
      <div class="action-buttons" id="learnActions">
        <button id="nextBatchBtn" class="active">换一组</button>
        <button id="learnBackBtn" class="secondary hidden">返回</button>
        <button id="resetBtn" class="secondary hidden">重置进度</button>
      </div>
    </div>

    <!-- 图表模式区域 -->
    <div id="chartView" class="hidden">
      <div class="chart-wrapper" id="chartContainer">
        <div class="chart-header"><button id="playChartBtn">播放</button></div>
      </div>
    </div>

    <!-- 模式四：玩一下 -->
    <div id="playView" class="hidden">
      <div id="playMenu" class="play-menu">
        <div class="play-menu-btn" id="startCatchGameBtn">
          <span class="play-menu-icon">
            <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 16 L34 16 L30.5 33 L9.5 33 Z"/>
              <path d="M13.5 16 C13.5 8.5 26.5 8.5 26.5 16"/>
              <path d="M15 22 L25 22"/>
              <path d="M16.5 27 L23.5 27"/>
            </svg>
          </span>
          接住它
        </div>
        <div class="play-menu-btn" id="startFillGameBtn">
          <span class="play-menu-icon">
            <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 33 L10.5 24 L27 6 L34 13 L17.5 31 Z"/>
              <path d="M10.5 24 L17.5 31"/>
              <path d="M24 9 L31 16"/>

      const utterance = new SpeechSynthesisUtterance(text);

      const voices = speechSynthesis.getVoices();
      let jaVoice = voices.find(v => v.name.includes('Kyoko') || v.name.includes('O-ren') || v.name.includes('Hattori'));

      if (jaVoice) utterance.voice = jaVoice;
      speechSynthesis.cancel(); speechSynthesis.speak(utterance);
    }

    // ================= 网格布局算法 =================
    function getGridLayout(poolSize) {
      const maxN = Math.min(poolSize, 18);
      for (let n = maxN; n >= 2; n--) {
        const cards = n * 2;
        let best = null;
        for (let cols = 2; cols <= 6; cols++) {
          if (cards % cols !== 0) continue;
          const rows = cards / cols;
          if (rows < 2 || rows > 6) continue;
          const squareness = Math.abs(cols - rows);
          if (!best || squareness < best.squareness || (squareness === best.squareness && cols > best.cols)) {
            best = { cols, rows, squareness };
          }
        }
        if (best) return { count: n, cols: best.cols, rows: best.rows };
      }
      return null;
    }
    function getGridStyleByCols(cols) {
      const fontMap = { 2: 48, 3: 40, 4: 36, 5: 30, 6: 26 };
      const widthMap = { 2: 220, 3: 320, 4: 420, 5: 500, 6: 560 };
      return { font: (fontMap[cols] || 32) + 'px', maxWidth: (widthMap[cols] || 400) + 'px' };
    }
    function applyGridLayout(gridEl, layout) {
      const style = getGridStyleByCols(layout.cols);
      gridEl.style.setProperty('--grid-cols', layout.cols);
      gridEl.style.setProperty('--grid-font', style.font);
      gridEl.style.maxWidth = style.maxWidth;
    }

    }

    function getRandomTraceCoords(e) {

    function startRandomDrawing(e) { e.preventDefault(); isRandomDrawing = true; const { x, y } = getRandomTraceCoords(e); randomLastX = x; randomLastY = y; }
    function drawRandom(e) {
      if (!isRandomDrawing) return; e.preventDefault();
      const { x, y } = getRandomTraceCoords(e);
      randomTraceCtx.beginPath(); randomTraceCtx.moveTo(randomLastX, randomLastY); randomTraceCtx.lineTo(x, y); randomTraceCtx.stroke();
      randomLastX = x; randomLastY = y;
    }

    randomTraceCanvas.addEventListener('mouseup', stopRandomDrawing); randomTraceCanvas.addEventListener('mouseleave', stopRandomDrawing);
    randomTraceCanvas.addEventListener('touchstart', startRandomDrawing, { passive: false }); randomTraceCanvas.addEventListener('touchmove', drawRandom, { passive: false });
    randomTraceCanvas.addEventListener('touchend', stopRandomDrawing); randomTraceCanvas.addEventListener('touchcancel', stopRandomDrawing);

    // ================= 模式二：学习模式 =================
    function getWeightedRandomItems(arr, n, masteredMap) {
      const pool = [];
      arr.forEach(item => { const weight = masteredMap[item.h] ? 1 : 2; for (let i = 0; i < weight; i++) pool.push(item); });
      const result = []; const used = new Set();
      while (result.length < n && pool.length > 0) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        const item = pool[randomIndex];
        if (!used.has(item.h)) { result.push(item); used.add(item.h); }
        pool.splice(randomIndex, 1);
      }
      if (result.length < n) {
        const remaining = arr.filter(item => !used.has(item.h));
        const shuffled = [...remaining].sort(() => 0.5 - Math.random());
        for (let i = 0; i < shuffled.length && result.length < n; i++) result.push(shuffled[i]);
      }
      return result.sort(() => 0.5 - Math.random());
    }
    function generateBatch() {
      if (learnMasteredMode) {
        currentBatch = allKanaItems.filter(i => mastered[i.h]);
        cardStates = currentBatch.map(() => ({ revealed: true, initialType: 'h' }));
        renderGrid(); updateStatus();
        return;
      }
      const pool = allKanaItems;
      let rawBatch = [];
      if (Object.keys(mastered).length === 0) {
        const shuffledGroups = [...similarGroups].sort(() => 0.5 - Math.random());
        let combined = [];
        for (let group of shuffledGroups) {
          for (let h of group) { const item = pool.find(i => i.h === h || i.k === h); if (item) combined.push(item); }
          if (combined.length >= 4) break;
        }
        const uniqueMap = {}; combined.forEach(item => uniqueMap[item.h] = item);
        rawBatch = Object.values(uniqueMap).slice(0, 4);
      }
      if (rawBatch.length < 4) {
        const countNeeded = 4 - rawBatch.length;
        const existingH = new Set(rawBatch.map(i => i.h));
        const remainingPool = pool.filter(i => !existingH.has(i.h));
        rawBatch = rawBatch.concat(getWeightedRandomItems(remainingPool, countNeeded, mastered));
      }
      currentBatch = rawBatch.sort(() => 0.5 - Math.random());
      const types = ['h', 'k', 'r'];
      cardStates = currentBatch.map(() => ({ revealed: false, initialType: types[Math.floor(Math.random() * types.length)] }));
      renderGrid(); updateStatus();
    }
    window.toggleMastered = function(h) {
      if (mastered[h]) delete mastered[h];
      else {
        mastered[h] = true;
        const count = allKanaItems.filter(i => mastered[i.h]).length;
        if (count >= totalKanaCount) {
          setTimeout(() => {
            showAlert('🎉 恭喜', '您已掌握全部71个假名！进度将重置，出现概率恢复默认。');
            mastered = {}; localStorage.setItem('kanaMastered', JSON.stringify(mastered));
            learnMasteredMode = false; updateLearnModeUI(); generateBatch();
          }, 100);
          return;
        }
      }
      localStorage.setItem('kanaMastered', JSON.stringify(mastered));
      if (learnMasteredMode && allKanaItems.filter(i => mastered[i.h]).length === 0) {
        learnMasteredMode = false;
        updateLearnModeUI();
        generateBatch();
        return;
      }
      if (learnMasteredMode) {
        updateLearnModeUI();
        generateBatch();
        return;
      }
      updateLearnModeUI(); updateStatus(); renderGrid();
    };

      const grid = document.getElementById('grid');
      grid.className = learnMasteredMode ? 'grid-container mastered-view' : 'grid-container';

        else {

      else {

    catchStartBtn.addEventListener('click', () => {

      catchLives = 5; catchItems = []; catchSpawnTimer = 0; catchScore = 0;
      const rect = catchCanvas.getBoundingClientRect();
      if (rect.width) { catchCanvas.width = rect.width; catchCanvas.height = rect.height; }
      catchBoxX = catchCanvas.width / 2;

    });
    function updateCatchHUD() {
      let heartsHtml = '';
      for (let i = 0; i < catchLives; i++) {
        heartsHtml += '<span style="color: #3E7E6E; font-size: 20px; font-weight: bold; line-height: 1; margin-right: 2px;">♡</span>';
      }
      catchLivesSpan.innerHTML = heartsHtml;

    }
    function stopCatchGame() {
      catchGameActive = false;
      if (catchAnimationFrame) cancelAnimationFrame(catchAnimationFrame);
      catchAnimationFrame = null;
    }
    function catchGameLoop(time) {
      if (!catchGameActive) return;
      const dt = (time - lastCatchTime) / 1000; lastCatchTime = time;
      catchSpawnTimer += dt;
      const maxOnScreen = 6;
      if (catchSpawnTimer > 0.5) {
        catchSpawnTimer = 0;
        if (catchItems.length < maxOnScreen) {
          let char;
          if (Math.random() < 0.5) {
            const types = ['h', 'k', 'r'];
            char = catchTargetItem[types[Math.floor(Math.random() * types.length)]];
          } else {
            let item;
            do { item = allKanaItems[Math.floor(Math.random() * allKanaItems.length)]; }
            while (item.h === catchTargetItem.h);
            const types = ['h', 'k', 'r'];
            char = item[types[Math.floor(Math.random() * types.length)]];
          }
          const dropSpeed = Math.min(120 + catchScore * 4, 280);
          catchItems.push({ x: Math.random() * (catchCanvas.width - 40) + 20, y: -20, char: char, speed: dropSpeed });
        }
      }
      catchItems.forEach(e => e.y += e.speed * dt);
      const boxY = catchCanvas.height - 60;
      for (let i = catchItems.length - 1; i >= 0; i--) {
        const item = catchItems[i];
        const isTarget = (item.char === catchTargetItem.h || item.char === catchTargetItem.k || item.char === catchTargetItem.r);
        if (item.y >= boxY - 15 && item.y <= boxY + 20) {
          if (item.x >= catchBoxX - catchBoxWidth / 2 && item.x <= catchBoxX + catchBoxWidth / 2) {
            if (isTarget) { speak(catchTargetItem.h); catchScore++; updateCatchHUD(); }
            else {
              catchLives--; updateCatchHUD();
              if (catchLives <= 0) {
                stopCatchGame();
                document.getElementById('catchGameOverModal').classList.remove('hidden');
                return;
              }
            }
            catchItems.splice(i, 1); continue;
          }
        }
        if (item.y > catchCanvas.height + 20) catchItems.splice(i, 1);
      }
      drawCatchGame();
      if (catchGameActive) catchAnimationFrame = requestAnimationFrame(catchGameLoop);
    }
    function drawCatchGame() {
      const rect = catchCanvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      if (catchCanvas.width !== rect.width || catchCanvas.height !== rect.height) {
        catchCanvas.width = rect.width; catchCanvas.height = rect.height;
      }
      catchCtx.clearRect(0, 0, catchCanvas.width, catchCanvas.height);
      catchCtx.font = '32px "Klee One", sans-serif'; catchCtx.textAlign = 'center'; catchCtx.textBaseline = 'middle';
      catchItems.forEach(e => { catchCtx.fillStyle = '#2C3E44'; catchCtx.fillText(e.char, e.x, e.y); });
      const boxY = catchCanvas.height - 60;
      const boxW = catchBoxWidth, boxH = 18, radius = 8;
      catchCtx.strokeStyle = '#2C3E44'; catchCtx.lineWidth = 4; catchCtx.lineCap = 'round';
      catchCtx.beginPath();
      catchCtx.moveTo(catchBoxX - boxW/2, boxY);
      catchCtx.lineTo(catchBoxX - boxW/2, boxY + boxH - radius);
      catchCtx.quadraticCurveTo(catchBoxX - boxW/2, boxY + boxH, catchBoxX - boxW/2 + radius, boxY + boxH);
      catchCtx.lineTo(catchBoxX + boxW/2 - radius, boxY + boxH);
      catchCtx.quadraticCurveTo(catchBoxX + boxW/2, boxY + boxH, catchBoxX + boxW/2, boxY + boxH - radius);
      catchCtx.lineTo(catchBoxX + boxW/2, boxY);
      catchCtx.stroke();
    }
    catchCanvas.addEventListener('mousemove', (e) => {
      if (!catchGameActive) return;
      const rect = catchCanvas.getBoundingClientRect();
      catchBoxX = e.clientX - rect.left;
      catchBoxX = Math.max(catchBoxWidth / 2, Math.min(catchCanvas.width - catchBoxWidth / 2, catchBoxX));
    });
    catchCanvas.addEventListener('touchmove', (e) => {
      if (!catchGameActive) return;
      e.preventDefault();
      const rect = catchCanvas.getBoundingClientRect();
      catchBoxX = e.touches[0].clientX - rect.left;
      catchBoxX = Math.max(catchBoxWidth / 2, Math.min(catchCanvas.width - catchBoxWidth / 2, catchBoxX));
    });

      fillPromptType = types[Math.floor(Math.random() * types.length)];
      fillPrompt.textContent = currentFillItem[fillPromptType];
      fillInput.innerHTML = ''; fillErrors = 0; fillResult.innerHTML = '';
      fillAnswered = false; updateFillHUD();
    }
    function updateFillHUD() {
      fillScoreSpan.textContent = fillScore;
      fillErrorsSpan.textContent = fillErrors + ' / 3';
    }
    function getFillValidAnswers() {
      const item = currentFillItem;
      const answers = [];
      if (fillPromptType !== 'h') answers.push({ value: item.h, label: '平假名' });
      if (fillPromptType !== 'k') answers.push({ value: item.k, label: '片假名' });
      if (fillPromptType !== 'r') answers.push({ value: item.r, label: '读音' });
      return answers;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function matchSegments(input, validValues) {
      const result = [];
      const sorted = [...validValues].sort((a, b) => b.length - a.length);
      let i = 0;
      while (i < input.length) {
        if (/\s/.test(input[i])) { result.push({ text: input[i], ok: true, space: true }); i++; continue; }
        let matched = false;
        for (const v of sorted) {
          if (input.substr(i, v.length).toLowerCase() === v.toLowerCase()) {
            result.push({ text: input.substr(i, v.length), ok: true });
            i += v.length; matched = true; break;
          }
        }
        if (!matched) { result.push({ text: input[i], ok: false }); i++; }
      }
      return result;
    }
    function checkFillAnswer() {
      if (fillAnswered) return;
      const rawInput = fillInput.textContent.trim();
      if (!rawInput) return;
      const validAnswers = getFillValidAnswers();
      const validValues = validAnswers.map(a => a.value);
      const segments = matchSegments(rawInput, validValues);
      const allCorrect = segments.length > 0 && segments.every(s => s.ok);
      if (allCorrect) {
        fillAnswered = true; fillScore++; updateFillHUD();
        fillResult.innerHTML = '<span style="color: #5FAF92;">✅ 正确！</span>';
        speak(currentFillItem.h);
        setTimeout(() => { nextFillQuestion(); setTimeout(() => fillInput.focus(), 50); }, 600);
        return;
      }
      fillErrors++;
      if (fillErrors > 3) fillErrors = 3;
      const html = segments.map(s => {
        const escaped = escapeHtml(s.text);
        if (s.space) return escaped;
        return `<span class="${s.ok ? 'ok' : 'err'}">${escaped}</span>`;
      }).join('');
      fillInput.innerHTML = html;
      const range = document.createRange();
      const sel = window.getSelection();
      range.selectNodeContents(fillInput); range.collapse(false);
      sel.removeAllRanges(); sel.addRange(range);
      if (fillErrors >= 3) {
        const answerText = validAnswers.map(a => `${a.label}「${escapeHtml(a.value)}」`).join(' 或 ');
        fillResult.innerHTML = `<span style="color:#E08888;">${answerText}</span>`;
      } else {
        fillResult.innerHTML = `<span style="color:#E08888;">❌ 标红的字符有误，请修改（${fillErrors}/3）</span>`;
      }
      updateFillHUD();
    }
    fillCheckBtn.addEventListener('click', checkFillAnswer);
    fillInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); checkFillAnswer(); }
    });
    fillInput.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, text);
    });
    fillRestartBtn.addEventListener('click', startFillGame);
    fillBackBtn.addEventListener('click', showPlayMenu);

    startMatchGameBtn.addEventListener('click', () => showModeSelect('match'));
    startFlipGameBtn.addEventListener('click', () => showModeSelect('flip'));
    startCatchGameBtn.addEventListener('click', () => showModeSelect('catch'));
    startFillGameBtn.addEventListener('click', () => showModeSelect('fill'));

    matchBackBtn.addEventListener('click', showPlayMenu);
    matchRestartBtn.addEventListener('click', initMatchGame);
    flipBackBtn.addEventListener('click', showPlayMenu);
    flipRestartBtn.addEventListener('click', initFlipGame);

    // ================= 书写弹窗 =================
    window.openWritingModal = function(h, k) {
      currentModalH = h; stopModalLoop(); traceBg.textContent = `${h} ${k}`;
      writingModal.classList.remove('hidden');
      setTimeout(() => { initCanvas(); }, 50);
    };
    modalPlayBtn.addEventListener('click', () => {
      clearTimeout(modalClickTimer);
      modalClickTimer = setTimeout(() => {
        if (isModalLooping) stopModalLoop();
        else if (currentModalH) speak(currentModalH);
      }, 250);
    });
    modalPlayBtn.addEventListener('dblclick', () => {
      clearTimeout(modalClickTimer);
      if (isModalLooping) stopModalLoop(); else startModalLoop();
    });
    function startModalLoop() {
      if (!currentModalH) return; stopModalLoop();
      isModalLooping = true; modalPlayBtn.textContent = '暂停'; modalPlayBtn.style.background = '#E08888';
      speak(currentModalH);
      modalLoopTimer = setInterval(() => speak(currentModalH), 1500);
    }
    function stopModalLoop() {
      isModalLooping = false; clearInterval(modalLoopTimer);
      modalPlayBtn.textContent = '播放'; modalPlayBtn.style.background = '#4A90A4';
    }
    function closeWritingModal() { writingModal.classList.add('hidden'); isDrawing = false; stopModalLoop(); }
    function initCanvas() {
      const container = canvas.parentElement; const rect = container.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#4A90A4';
      canvasInitialized = true; clearCanvas();
    }
    function clearCanvas() {
      if (!canvasInitialized) return;
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    }
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function startDrawing(e) { e.preventDefault(); isDrawing = true; const { x, y } = getCanvasCoords(e); lastX = x; lastY = y; }
    function draw(e) {
      if (!isDrawing) return; e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      lastX = x; lastY = y;
    }
    function stopDrawing() { isDrawing = false; }
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing); canvas.addEventListener('touchcancel', stopDrawing);
    closeModalBtn.addEventListener('click', closeWritingModal);
    clearCanvasBtn.addEventListener('click', clearCanvas);
    writingModal.addEventListener('click', (e) => { if (e.target === writingModal) closeWritingModal(); });

    // ================= 重置进度确认弹窗 =================
    resetBtn.addEventListener('click', () => {
      resetConfirmModal.classList.remove('hidden');
    });
    resetCancelBtn.addEventListener('click', () => {
      resetConfirmModal.classList.add('hidden');
    });
    resetConfirmBtn.addEventListener('click', () => {
      resetConfirmModal.classList.add('hidden');
      mastered = {};
      localStorage.setItem('kanaMastered', JSON.stringify(mastered));
      learnMasteredMode = false;
      updateLearnModeUI(); updateStatus();
      if (currentMode === 'learn') generateBatch();
    });
    resetConfirmModal.addEventListener('click', (e) => {
      if (e.target === resetConfirmModal) resetConfirmModal.classList.add('hidden');
    });

    // ================= 模式切换 =================
    function switchMode(mode) {
      currentMode = mode;
      modeRandomBtn.classList.toggle('active', mode === 'random');
      modeLearnBtn.classList.toggle('active', mode === 'learn');
      modeChartBtn.classList.toggle('active', mode === 'chart');
      modePlayBtn.classList.toggle('active', mode === 'play');
      randomView.classList.toggle('hidden', mode !== 'random');
      learnView.classList.toggle('hidden', mode !== 'learn');
      chartView.classList.toggle('hidden', mode !== 'chart');
      playView.classList.toggle('hidden', mode !== 'play');
      if (mode !== 'chart') stopPlayback(); else renderChart();
      stopModalLoop();
      stopCatchGame();
      resetConfirmModal.classList.add('hidden');
      if (mode === 'random') generateRandomCard();
      if (mode === 'learn') { updateLearnModeUI(); generateBatch(); }
      if (mode === 'play') showPlayMenu();
    }
    modeRandomBtn.addEventListener('click', () => switchMode('random'));
    modeLearnBtn.addEventListener('click', () => switchMode('learn'));
    modeChartBtn.addEventListener('click', () => switchMode('chart'));
    modePlayBtn.addEventListener('click', () => switchMode('play'));
    document.getElementById('nextBatchBtn').addEventListener('click', generateBatch);

    // ================= resize =================
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (canvasInitialized && !writingModal.classList.contains('hidden')) initCanvas();
        if (randomCanvasInitialized && !randomTraceContainer.classList.contains('hidden')) initRandomTraceCanvas();
      }, 300);
    });

    // 启动
    updateLearnModeUI();
    switchMode('random');
  </script>
</body>
</html>
